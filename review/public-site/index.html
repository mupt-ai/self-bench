<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/dari-logo.svg" />
    <title>Self-Bench · dari.dev</title>
    <meta name="description" content="Find which model is best for your repository, measured on evals built from its own history." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <script>
      // Apply the saved theme and animation choice before first paint, so nothing flashes.
      // Same rule as review/src/public-site/preferences.ts, and the same script in both sites'
      // index.html: the cookie on selfbench.dev is shared with the app, local storage is not.
      try {
        var shared = /(^|\.)selfbench\.dev$/.test(location.hostname);
        var scope = "; Path=/; Max-Age=31536000; SameSite=Lax" +
          (shared ? "; Domain=selfbench.dev" : "") + (location.protocol === "https:" ? "; Secure" : "");
        var read = function (key) {
          var match = document.cookie.match(new RegExp("(?:^|; )" + key + "=([^;]*)"));
          if (match) return decodeURIComponent(match[1]);
          var saved = null;
          try { saved = localStorage.getItem(key); } catch (error) {}
          // A choice saved before the cookie existed: share it from now on.
          if (saved) document.cookie = key + "=" + encodeURIComponent(saved) + scope;
          return saved;
        };
        if (read("selfbench-theme") === "dark")
          document.documentElement.setAttribute("data-theme", "dark");
        if (read("selfbench-motion") === "off")
          document.documentElement.setAttribute("data-motion", "off");
      } catch (error) {}
    </script>
  </head>
  <body class="h-full font-sans text-sm leading-normal text-(--foreground) [text-rendering:optimizeLegibility]">
    <div id="root" class="h-full"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
