<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/dari-logo.svg" />
    <title>Self-Bench · dari.dev</title>
    <meta name="description" content="Find which model is best for your repository, measured on evals built from its own history." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <script>
      // Apply the theme and animation choice before first paint, so nothing flashes. Same rule
      // as settleTheme in review/src/public-site/theme.ts and the storage in preferences.ts, and
      // the same script in both sites' index.html: a cookie on selfbench.dev, shared with the
      // app, plus this origin's local storage. Rewriting both on every visit keeps them fresh.
      try {
        var shared = /(^|\.)selfbench\.dev$/.test(location.hostname);
        var scope = "; Path=/; Max-Age=31536000; SameSite=Lax" +
          (shared ? "; Domain=selfbench.dev" : "") + (location.protocol === "https:" ? "; Secure" : "");
        var read = function (key) {
          var match = document.cookie.match(new RegExp("(?:^|; )" + key + "=([^;]*)"));
          if (match) return decodeURIComponent(match[1]);
          try { return localStorage.getItem(key); } catch (error) { return null; }
        };
        var save = function (key, value) {
          document.cookie = key + "=" + encodeURIComponent(value) + scope;
          try { localStorage.setItem(key, value); } catch (error) {}
        };
        // Follow the system until the visitor picks; a later system change wins once.
        var system = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        var saved = read("selfbench-theme");
        var seen = read("selfbench-system");
        var known = saved === "dark" || saved === "light";
        var theme = known && (!seen || seen === system) ? saved : system;
        save("selfbench-theme", theme);
        save("selfbench-system", system);
        if (theme === "dark") document.documentElement.setAttribute("data-theme", "dark");
        var motion = read("selfbench-motion");
        if (motion) save("selfbench-motion", motion);
        if (motion === "off") document.documentElement.setAttribute("data-motion", "off");
      } catch (error) {}
    </script>
  </head>
  <body class="h-full font-sans text-sm leading-normal text-(--foreground) [text-rendering:optimizeLegibility]">
    <div id="root" class="h-full"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
