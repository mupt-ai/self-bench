<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/dari-logo.svg" />
    <title>SelfBench</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      // Apply the saved theme before first paint so a dark-mode visitor never sees a flash.
      try {
        var theme = localStorage.getItem("selfbench-theme");
        if (theme === "dark") document.documentElement.setAttribute("data-theme", "dark");
        // The public site's Disable Animations choice also stills the sign-in page's water.
        if (localStorage.getItem("selfbench-motion") === "off")
          document.documentElement.setAttribute("data-motion", "off");
      } catch (error) {}
    </script>
  </head>
  <body class="h-full bg-(--background) font-sans text-sm leading-normal text-(--foreground) antialiased [text-rendering:optimizeLegibility]">
    <!-- Referenced by theme.css to tint avatars in dark mode: channels scaled, blue kept most. -->
    <svg aria-hidden="true" style="position: absolute; width: 0; height: 0">
      <filter id="ink-cast" color-interpolation-filters="sRGB">
        <feColorMatrix type="matrix" values="0.72 0 0 0 0  0 0.78 0 0 0  0 0 0.88 0 0  0 0 0 1 0" />
      </filter>
    </svg>
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
