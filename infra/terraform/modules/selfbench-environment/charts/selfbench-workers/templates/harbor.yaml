# The Harbor worker: each pod runs 10 Harbor checks or solver trials at once, and KEDA sets the
# pod count from the Harbor queue's backlog. A pod being removed stops taking work and finishes
# what it holds first: a solver evaluation is one unretried activity of up to 72 hours.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: selfbench-harbor-worker
spec:
  selector:
    matchLabels:
      app: selfbench-harbor-worker
  template:
    metadata:
      labels:
        app: selfbench-harbor-worker
      annotations:
        # Autopilot keeps a busy pod through node scale-down and upgrades.
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
    spec:
      serviceAccountName: selfbench-worker
      terminationGracePeriodSeconds: 259500
      containers:
        - name: worker
          image: {{ .Values.image | quote }}
          command:
            - node
            - --env-file=/secrets/shared-env
            - --env-file=/secrets/worker-env
            - dist/temporal/worker-main.js
          env:
            - name: SELFBENCH_WORKER_ROLE
              value: harbor
            - name: SELFBENCH_HARBOR_CONCURRENCY
              value: "10"
            - name: SELFBENCH_WORKER_SHUTDOWN_GRACE_SECONDS
              value: "259200"
          resources:
            requests: { cpu: "2", memory: 8Gi, ephemeral-storage: 10Gi }
            limits: { cpu: "2", memory: 8Gi, ephemeral-storage: 10Gi }
          volumeMounts:
            - name: secrets
              mountPath: /secrets
              readOnly: true
      volumes:
        - name: secrets
          csi:
            driver: secrets-store-gke.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: selfbench-worker-env
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: selfbench-harbor-worker
spec:
  scaleTargetRef:
    name: selfbench-harbor-worker
  minReplicaCount: 0
  maxReplicaCount: {{ .Values.maxReplicas }}
  # Wait 15 minutes of lower backlog before removing pods.
  cooldownPeriod: 900
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 900
  triggers:
    - type: temporal
      metadata:
        endpoint: {{ .Values.temporal.address | quote }}
        namespace: {{ .Values.temporal.namespace | quote }}
        taskQueue: {{ .Values.temporal.queue | quote }}
        queueTypes: activity
        targetQueueSize: "10"
      authenticationRef:
        name: temporal
