# Harbor work as jobs: KEDA starts a job pod per 10 Harbor tasks waiting on the queue, and each pod
# runs up to 10 Harbor checks or solver trials and exits once it has been idle for 5 minutes.
# Nothing removes a busy pod: Autopilot caps a pod's termination grace at 10 minutes, far short of
# a solver evaluation (one unretried activity of up to 72 hours), so pods only ever end themselves.
# GKE's own system pods (konnectivity-agent, which grows with the node count) preempt whatever
# lower-priority pod holds the room they need, so workers keep to nodes of their own, tainted to
# keep those pods off (_helpers.tpl).
apiVersion: keda.sh/v1alpha1
kind: ScaledJob
metadata:
  name: selfbench-harbor-worker
spec:
  maxReplicaCount: {{ .Values.maxReplicas }}
  # The backlog excludes tasks already running, so count only pending jobs against it.
  scalingStrategy:
    strategy: accurate
  # A release (a new image) leaves running jobs alone; only new jobs use the new spec.
  rollout:
    strategy: gradual
  successfulJobsHistoryLimit: 5
  failedJobsHistoryLimit: 5
  triggers:
    - type: temporal
      metadata:
        endpoint: {{ .Values.temporal.address | quote }}
        namespace: {{ .Values.temporal.namespace | quote }}
        taskQueue: {{ .Values.temporal.queue | quote }}
        queueTypes: activity
        targetQueueSize: "10"
      authenticationRef:
        name: temporal
  jobTargetRef:
    backoffLimit: 0
    template:
      metadata:
        labels:
          app: selfbench-harbor-worker
        annotations:
          # Autopilot keeps a running pod through node scale-down and upgrades for up to 7 days.
          cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
      spec:
        restartPolicy: Never
        # Makes the pod's pause process PID 1, so a SIGTERM that lands before the worker installs its
        # handlers ends node at once. As PID 1, node ignored it, then polled and claimed trials until
        # the grace period's SIGKILL lost them.
        shareProcessNamespace: true
        serviceAccountName: selfbench-worker
        {{- include "selfbench-workers.separation" . | nindent 8 }}
        securityContext:
          # The image runs as node (1000); the scratch disk must be writable by it.
          fsGroup: 1000
        containers:
          - name: worker
            image: {{ .Values.image | quote }}
            # The CSI driver mounts files; export each one under its env name before Node starts.
            command:
              - /bin/sh
              - -ec
              - |
                for file in /secrets/*; do
                  name=${file##*/}
                  export "$name=$(cat "$file")"
                done
                exec node dist/temporal/worker-main.js
            env:
              {{- range $name, $value := .Values.env }}
              - name: {{ $name | quote }}
                value: {{ $value | quote }}
              {{- end }}
              - name: SELFBENCH_WORKER_ROLE
                value: harbor
              - name: SELFBENCH_ENVIRONMENT
                value: {{ .Values.environment | quote }}
              - name: SELFBENCH_HARBOR_CONCURRENCY
                value: "10"
              - name: SELFBENCH_WORKER_IDLE_EXIT_SECONDS
                value: "300"
              - name: SELFBENCH_WORKER_SHUTDOWN_GRACE_SECONDS
                value: "259200"
            resources:
              requests: { cpu: "2", memory: 8Gi, ephemeral-storage: 2Gi }
              limits: { cpu: "2", memory: 8Gi, ephemeral-storage: 2Gi }
            volumeMounts:
              - name: secrets
                mountPath: /secrets
                readOnly: true
              - name: scratch
                mountPath: /tmp
        volumes:
          - name: secrets
            csi:
              driver: secrets-store-gke.csi.k8s.io
              readOnly: true
              volumeAttributes:
                secretProviderClass: selfbench-worker-secrets
          # Ten unpacked task bundles and their Harbor downloads, on a disk of the pod's own.
          - name: scratch
            ephemeral:
              volumeClaimTemplate:
                spec:
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 100Gi
