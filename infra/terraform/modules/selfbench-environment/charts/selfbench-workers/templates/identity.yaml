# Pods act as the runtime Google service account (Workload Identity), and mount one file per
# worker secret from Secret Manager.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: selfbench-worker
  annotations:
    iam.gke.io/gcp-service-account: {{ .Values.runtimeAccount | quote }}
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: selfbench-worker-secrets
spec:
  provider: gke
  parameters:
    secrets: |
      {{- range .Values.secrets.files }}
      - resourceName: {{ .resourceName | quote }}
        path: {{ .path | quote }}
      {{- end }}
---
# KEDA reads the Temporal API key as its own identity (keda/keda-operator).
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: temporal
spec:
  gcpSecretManager:
    podIdentity:
      provider: gcp
    secrets:
      - parameter: apiKey
        id: {{ .Values.secrets.temporal.id | quote }}
        version: {{ .Values.secrets.temporal.version | quote }}
