# Pods act as the runtime Google service account (Workload Identity), and mount the pinned
# shared and worker env-file bundles from Secret Manager.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount }}
  annotations:
    iam.gke.io/gcp-service-account: {{ .Values.runtimeAccount | quote }}
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: selfbench-worker-env
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: {{ .Values.secrets.shared | quote }}
        path: shared-env
      - resourceName: {{ .Values.secrets.worker | quote }}
        path: worker-env
---
# KEDA reads the Temporal API key as its own identity (keda/keda-operator).
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: temporal
spec:
  gcpSecretManager:
    podIdentity:
      provider: gcp
    secrets:
      - parameter: apiKey
        id: {{ .Values.secrets.temporal.id | quote }}
        version: {{ .Values.secrets.temporal.version | quote }}
