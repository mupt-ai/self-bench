# Standalone cloud runtime. Do NOT merge with the local-development compose.yaml.
# Supply absolute protected paths; never commit secret payloads.
name: selfbench-${SELFBENCH_ENVIRONMENT:?Set dev or prod}
x-app: &app
  image: ${SELFBENCH_IMAGE:?Set an immutable Artifact Registry image digest}
  restart: unless-stopped
  init: true
  stop_grace_period: 2m
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options:
      max-size: 20m
      max-file: '3'
services:
  api:
    <<: *app
    command: [node, dist/api/main.js]
    env_file:
      - path: ${SELFBENCH_SHARED_ENV_FILE:?Set protected shared env-file path}
        format: raw
      - path: ${SELFBENCH_API_ENV_FILE:?Set protected API env-file path}
        format: raw
    ports:
      - 127.0.0.1:8080:8080
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s
  worker:
    <<: *app
    command: [node, dist/temporal/worker-main.js]
    environment:
      # Ordinary release configuration overrides any legacy value in shared secrets.
      SELFBENCH_ACTIVITY_CONCURRENCY: ${SELFBENCH_ACTIVITY_CONCURRENCY:?Set worker activity concurrency}
      # Harbor admission counts these replicas' slots alongside this worker's own.
      SELFBENCH_HARBOR_WORKERS: ${SELFBENCH_HARBOR_WORKERS:-0}
    env_file:
      - path: ${SELFBENCH_SHARED_ENV_FILE:?Set protected shared env-file path}
        format: raw
      - path: ${SELFBENCH_WORKER_ENV_FILE:?Set protected worker env-file path}
        format: raw
    # Serializes initial startup/migrations. Does not prove worker registration or DB readiness.
    depends_on:
      api:
        condition: service_healthy
  # Harbor-only replicas: each polls only `<queue>-harbor`. The 5 GiB limit sizes each to the
  # 10-slot cap (2.25 GiB reserved + 256 MiB per Harbor client), so a VM needs ~5 GiB per replica
  # beyond what the API and combined worker use.
  harbor-worker:
    <<: *app
    command: [node, dist/temporal/worker-main.js]
    environment:
      SELFBENCH_WORKER_QUEUES: harbor
    mem_limit: 5g
    deploy:
      replicas: ${SELFBENCH_HARBOR_WORKERS:-0}
    env_file:
      - path: ${SELFBENCH_SHARED_ENV_FILE:?Set protected shared env-file path}
        format: raw
      - path: ${SELFBENCH_WORKER_ENV_FILE:?Set protected worker env-file path}
        format: raw
    depends_on:
      api:
        condition: service_healthy
# No Docker socket, model secrets on the API, local artifacts, or local Postgres/Temporal.
# Host TLS proxy is configured separately; only its 80/443 listeners may be public.
