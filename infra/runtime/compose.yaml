# Standalone cloud runtime. Do NOT merge with the local-development compose.yaml.
# Supply absolute protected paths; never commit secret payloads.
name: selfbench-${SELFBENCH_ENVIRONMENT:?Set dev or prod}
x-app: &app
  image: ${SELFBENCH_IMAGE:?Set an immutable Artifact Registry image digest}
  restart: unless-stopped
  init: true
  stop_grace_period: 2m
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options:
      max-size: 20m
      max-file: '3'
services:
  api:
    <<: *app
    # Off the VM once the API runs on Cloud Run: release.env sets COMPOSE_PROFILES=api only while
    # the VM still serves it.
    profiles: [api]
    command: [node, dist/api/main.js]
    env_file:
      - path: ${SELFBENCH_SHARED_ENV_FILE:?Set protected shared env-file path}
        format: raw
      - path: ${SELFBENCH_API_ENV_FILE:?Set protected API env-file path}
        format: raw
    ports:
      - 127.0.0.1:8080:8080
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s
  worker:
    <<: *app
    command: [node, dist/temporal/worker-main.js]
    environment:
      # Ordinary release configuration overrides any legacy value in shared secrets.
      SELFBENCH_ACTIVITY_CONCURRENCY: ${SELFBENCH_ACTIVITY_CONCURRENCY:?Set worker activity concurrency}
    env_file:
      - path: ${SELFBENCH_SHARED_ENV_FILE:?Set protected shared env-file path}
        format: raw
      - path: ${SELFBENCH_WORKER_ENV_FILE:?Set protected worker env-file path}
        format: raw
    # Serializes startup with a VM-hosted API; deploy-host.sh migrates before either starts.
    depends_on:
      api:
        condition: service_healthy
        required: false
# No Docker socket, model secrets on the API, local artifacts, or local Postgres/Temporal.
# Host TLS proxy is configured separately; only its 80/443 listeners may be public.
