# Standalone cloud runtime. Do NOT merge with the local-development compose.yaml.
# Supply absolute protected paths; never commit secret payloads.
name: selfbench-${SELFBENCH_ENVIRONMENT:?Set dev or prod}
x-app: &app
  image: ${SELFBENCH_IMAGE:?Set an immutable Artifact Registry image digest}
  restart: unless-stopped
  init: true
  stop_grace_period: 2m
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options:
      max-size: 20m
      max-file: '3'
services:
  worker:
    <<: *app
    command: [node, dist/temporal/worker-main.js]
    environment:
      # Ordinary release configuration overrides any legacy value in shared secrets.
      SELFBENCH_ACTIVITY_CONCURRENCY: ${SELFBENCH_ACTIVITY_CONCURRENCY:?Set worker activity concurrency}
    env_file:
      - path: ${SELFBENCH_SHARED_ENV_FILE:?Set protected shared env-file path}
        format: raw
      - path: ${SELFBENCH_WORKER_ENV_FILE:?Set protected worker env-file path}
        format: raw
# No Docker socket, model secrets on the API, local artifacts, or local Postgres/Temporal.
# The API runs on Cloud Run; this VM serves nothing publicly.
