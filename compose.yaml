# Compose names the project after this directory, so each worktree gets its own
# containers, volumes, and image tags. Host ports are ephemeral; resolve them with
# `docker compose port api 8080`. Docker generation also needs the sandbox image:
# `docker compose --profile sandbox up -d --build`. Local Stripe webhooks:
# `docker compose --profile stripe up -d`.
#
# Older checkouts used the fixed project name `selfbench` (volumes `selfbench_*`).
# To keep that data: `COMPOSE_PROJECT_NAME=selfbench docker compose up -d --build`.
#
# Shared by the API and the worker. Provider control credentials and the GitHub OAuth secret
# are deliberately not here: they go only to the service that needs them.
x-selfbench-environment: &selfbench-environment
  SELFBENCH_API_HOST: 0.0.0.0
  SELFBENCH_API_TOKEN: ${SELFBENCH_API_TOKEN:-selfbench-local}
  SELFBENCH_BUILD_COMMIT: ${SELFBENCH_BUILD_COMMIT:-}
  SELFBENCH_TEMPORAL_ADDRESS: temporal:7233
  # Generation from the site needs its queue named; the combined worker serves it alongside
  # SELFBENCH_TASK_QUEUE, so both default to the same queue.
  SELFBENCH_TASK_QUEUE: ${SELFBENCH_TASK_QUEUE:-selfbench-dev}
  SELFBENCH_GENERATION_TASK_QUEUE: ${SELFBENCH_GENERATION_TASK_QUEUE:-selfbench-dev}
  SELFBENCH_ARTIFACT_BACKEND: local
  SELFBENCH_ARTIFACT_DIR: /var/lib/selfbench/artifacts
  SELFBENCH_EXECUTION_BACKEND: ${SELFBENCH_EXECUTION_BACKEND:-docker}
  SELFBENCH_DOCKER_IMAGE: ${SELFBENCH_DOCKER_IMAGE:-selfbench-sandbox:local}
  SELFBENCH_HARBOR_ENVIRONMENT: ${SELFBENCH_HARBOR_ENVIRONMENT:-}
  SELFBENCH_VERCEL_IMAGE: ${SELFBENCH_VERCEL_IMAGE:-}
  SELFBENCH_VERCEL_TIMEOUT_CAP: ${SELFBENCH_VERCEL_TIMEOUT_CAP:-}
  SELFBENCH_E2B_TEMPLATE: ${SELFBENCH_E2B_TEMPLATE:-}
  SELFBENCH_E2B_TIMEOUT_CAP: ${SELFBENCH_E2B_TIMEOUT_CAP:-}
  # Managed generation: offering model access and sandboxes on SelfBench's own accounts
  # follows from which keys are set. The OpenRouter key is worker-only; the E2B key is
  # shared because the API runs managed export sandboxes.
  SELFBENCH_MANAGED_OPENROUTER_API_KEY: ${SELFBENCH_MANAGED_OPENROUTER_API_KEY:-}
  SELFBENCH_MANAGED_E2B_API_KEY: ${SELFBENCH_MANAGED_E2B_API_KEY:-}
  SELFBENCH_MANAGED_E2B_DOMAIN: ${SELFBENCH_MANAGED_E2B_DOMAIN:-}
  # Shared billing policy. Stripe secrets stay on the API so generation never talks to Stripe.
  SELFBENCH_BILLING_UNIT_SCALE: ${SELFBENCH_BILLING_UNIT_SCALE:-}
  SELFBENCH_BILLING_MARKUP_BPS: ${SELFBENCH_BILLING_MARKUP_BPS:-}
  SELFBENCH_STRIPE_METER_EVENT_NAME: ${SELFBENCH_STRIPE_METER_EVENT_NAME:-}
  # The site database: users, connected repos, and evaluation records. Migrations run at startup.
  SELFBENCH_DATABASE_URL: postgres://selfbench:selfbench@site-postgres:5432/selfbench
  SELFBENCH_EVAL_CREDENTIAL_KEY: ${SELFBENCH_EVAL_CREDENTIAL_KEY:-}
  # Sandbox jobs report back through the API when both are set. Sandboxes run outside this
  # network, so the URL is the tunnel or public origin, never the ephemeral host port.
  SELFBENCH_SANDBOX_SECRET: ${SELFBENCH_SANDBOX_SECRET:-}
  SELFBENCH_SANDBOX_CALLBACK_URL: ${SELFBENCH_SANDBOX_CALLBACK_URL:-}

services:
  postgres:
    image: postgres:17.6-bookworm
    # Match the app services, so a Docker daemon restart brings the database back with
    # the stack instead of leaving Temporal and the API crash-looping without it.
    restart: on-failure
    environment:
      POSTGRES_DB: temporal
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    volumes:
      - temporal-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 20

  site-postgres:
    image: postgres:17.6-bookworm
    restart: on-failure
    environment:
      POSTGRES_DB: selfbench
      POSTGRES_USER: selfbench
      POSTGRES_PASSWORD: selfbench
    volumes:
      - site-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U selfbench"]
      interval: 5s
      timeout: 5s
      retries: 20

  temporal:
    image: temporalio/auto-setup:1.29.6
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: postgres
    ports:
      - "127.0.0.1::7233"
    restart: on-failure

  api:
    image: ${COMPOSE_PROJECT_NAME}-selfbench
    build:
      context: .
      args:
        SELFBENCH_BUILD_COMMIT: ${SELFBENCH_BUILD_COMMIT:-}
    depends_on:
      temporal:
        condition: service_started
      site-postgres:
        condition: service_healthy
    environment:
      <<: *selfbench-environment
      # Local CLI batches fetch PR metadata here, before Temporal dispatch.
      GH_TOKEN: ${GH_TOKEN:-}
      # selfbench.dev sign-in. Set the GitHub OAuth app in .env to serve the signed-in site;
      # leave GITHUB_OAUTH_CLIENT_ID unset to keep the bearer-token Ledger.
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:-}
      SELFBENCH_SESSION_SECRET: ${SELFBENCH_SESSION_SECRET:-}
      # Browser origin / OAuth callback. Set this to the tunnel or reverse-proxy URL
      # before `up`; do not use the ephemeral host port from `docker compose port`.
      SELFBENCH_PUBLIC_URL: ${SELFBENCH_PUBLIC_URL:-http://127.0.0.1:8080}
      # Where released results are shown, for links from the Releases tab.
      SELFBENCH_RESULTS_SITE_URL: ${SELFBENCH_RESULTS_SITE_URL:-}
      SELFBENCH_STRIPE_SECRET_KEY: ${SELFBENCH_STRIPE_SECRET_KEY:-}
      SELFBENCH_STRIPE_WEBHOOK_SECRET: ${SELFBENCH_STRIPE_WEBHOOK_SECRET:-}
      SELFBENCH_STRIPE_PRICE_ID: ${SELFBENCH_STRIPE_PRICE_ID:-}
      SELFBENCH_STRIPE_WEBHOOK_SECRET_FILE: /run/selfbench-stripe/webhook-secret
    ports:
      - "127.0.0.1::8080"
    volumes:
      - artifacts:/var/lib/selfbench/artifacts
      - stripe-secrets:/run/selfbench-stripe:ro
    restart: on-failure

  worker:
    image: ${COMPOSE_PROJECT_NAME}-selfbench
    build:
      context: .
      args:
        SELFBENCH_BUILD_COMMIT: ${SELFBENCH_BUILD_COMMIT:-}
    command: ["node", "dist/temporal/worker-main.js"]
    depends_on:
      temporal:
        condition: service_started
      site-postgres:
        condition: service_healthy
    environment:
      <<: *selfbench-environment
      GH_TOKEN: ${GH_TOKEN:-}
      MODAL_TOKEN_ID: ${MODAL_TOKEN_ID:-}
      MODAL_TOKEN_SECRET: ${MODAL_TOKEN_SECRET:-}
      VERCEL_TOKEN: ${VERCEL_TOKEN:-}
      VERCEL_TEAM_ID: ${VERCEL_TEAM_ID:-}
      VERCEL_PROJECT_ID: ${VERCEL_PROJECT_ID:-}
      E2B_API_KEY: ${E2B_API_KEY:-}
      E2B_DOMAIN: ${E2B_DOMAIN:-}
      DAYTONA_API_KEY: ${DAYTONA_API_KEY:-}
      SELFBENCH_ACTIVITY_CONCURRENCY: ${SELFBENCH_ACTIVITY_CONCURRENCY:-}
    # Keep artifact ownership compatible with the API's node user while retaining Docker access.
    group_add:
      - ${DOCKER_GID:-0}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${SELFBENCH_MODAL_CONFIG_PATH:-/dev/null}:/home/node/.modal.toml:ro
      - artifacts:/var/lib/selfbench/artifacts
    restart: on-failure

  sandbox:
    image: ${SELFBENCH_DOCKER_IMAGE:-selfbench-sandbox:local}
    build:
      context: .
      dockerfile: Dockerfile.sandbox
    profiles: ["sandbox"]
    restart: "no"
    entrypoint: ["true"]

  # Forwards Stripe events to the API. The tunnel is not a public Stripe webhook
  # target, so local billing needs this instead of a Dashboard endpoint. The
  # wrapper stores the generated signing secret for the API automatically.
  stripe:
    image: stripe/stripe-cli:v1.51.0
    profiles: ["stripe"]
    depends_on:
      api:
        condition: service_started
    environment:
      STRIPE_API_KEY: ${SELFBENCH_STRIPE_SECRET_KEY:-}
    entrypoint: ["/usr/local/bin/selfbench-stripe-listen"]
    volumes:
      - ./scripts/stripe-listen.sh:/usr/local/bin/selfbench-stripe-listen:ro
      - stripe-secrets:/run/selfbench-stripe
    restart: on-failure

volumes:
  artifacts:
  site-postgres:
  temporal-postgres:
  stripe-secrets:
