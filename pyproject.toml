[project]
name = "selfbench"
version = "0.2.0"
description = "Create, validate, and curate private software-engineering evaluations for Harbor"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "harbor>=0.20,<0.21",
]

[tool.uv-build]
package-data = { "selfbench" = ["skills/selfbench/SKILL.md", "review_dist/**/*"] }

[project.scripts]
selfbench = "selfbench.cli:main"

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"
