[project]
name = "selfbench"
version = "0.2.0"
description = "Build, curate, and run private software-engineering evaluations with Harbor"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "harbor>=0.20,<0.21",
]

[project.scripts]
selfbench = "selfbench.cli:main"

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"
