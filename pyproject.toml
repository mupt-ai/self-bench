[project]
name = "selfbench"
version = "0.2.0"
description = "Build, curate, and run private software-engineering evaluations with Harbor"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "harbor>=0.20,<0.21",
]

[project.optional-dependencies]
# Modal execution environment for public validation that fans out without a
# local Docker daemon. Harbor lazily imports the Modal SDK only when
# `--env modal` is requested, so this extra is opt-in. Install with
# `uv sync --extra modal`.
modal = [
    "modal>=1.5.1",
    "dockerfile-parse>=2.0.1",
]

[tool.uv-build]
package-data = { "selfbench" = ["skills/selfbench/SKILL.md", "review_dist/**/*"] }

[project.scripts]
selfbench = "selfbench.cli:main"

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"
