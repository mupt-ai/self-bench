[project]
name = "selfbench"
version = "0.1.0"
description = "selfbench: evaluate coding agents against benchmarks built from your own merged PRs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "modal>=1.5.1",
]

[project.scripts]
selfbench = "selfbench.cli:main"

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"
