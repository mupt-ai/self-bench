[project]
name = "mysb"
version = "0.1.0"
description = "make-your-swebench: turn your own merged PRs into a private SWE-bench and run coding agents against them on Modal"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "modal>=1.5.1",
]

[project.scripts]
mysb = "mysb.cli:main"

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"
