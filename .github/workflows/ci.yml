name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
        working-directory: docs
      - run: npm run validate
        working-directory: docs

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # The Harbor the worker image installs, for the tests that build trials with it
      # (tests/harbor/harbor-contract.test.ts).
      - uses: astral-sh/setup-uv@v6
      - name: Install Harbor
        run: uv tool install --python 3.12 --constraints src/harnesses/harbor/harbor-constraints.txt "harbor[e2b,daytona,modal,vercel]==$(sed -n 's/^ARG HARBOR_VERSION=//p' Dockerfile)"
      - run: bun run check
      - run: bun run test
        env:
          SELFBENCH_REQUIRE_HARBOR: "1"
      - run: bun run build
      # Includes the package checks; do not pack/install twice through validate.
      - name: Verify packed application build stage
        run: bun run verify:package:docker
