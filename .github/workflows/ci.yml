name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - uses: oven-sh/setup-bun@v2
      - run: uv sync --locked --python 3.12
      - run: bun install --frozen-lockfile
      - run: bun run validate
        env:
          UV_PYTHON: "3.12"
