name: CLI release

# Pushing a cli-vX.Y.Z tag builds the single-file CLI and attaches it to a GitHub
# prerelease. The curl installer downloads from these releases. Releases are marked
# prerelease so deploy-prod.yml (which runs on published, non-prerelease releases)
# does not start.

on:
  workflow_dispatch:
  push:
    tags:
      - "cli-v*"

permissions:
  contents: write

concurrency:
  group: cli-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile
      - run: bun run validate

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          package_version="$(node -p "require('./package.json').version")"
          test "${GITHUB_REF_NAME#cli-v}" = "$package_version"

      - run: sh scripts/build-cli.sh

      - name: Create prerelease
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/cli/self-bench.js dist/cli/self-bench.js.sha256 \
            --title "SelfBench CLI ${GITHUB_REF_NAME#cli-v}" \
            --notes "Single-file SelfBench CLI. Install with: curl -fsSL https://raw.githubusercontent.com/mupt-ai/self-bench/main/scripts/install-cli.sh | sh" \
            --prerelease --verify-tag
