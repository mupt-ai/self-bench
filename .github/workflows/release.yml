name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  pypi:
    if: github.repository == 'mupt-ai/selfbench'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/selfbench
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: oven-sh/setup-bun@v2
      - name: Verify release version
        run: test "v$(uv version --short)" = "$GITHUB_REF_NAME"
      - run: bun install --frozen-lockfile
      - run: bun run build:review
      - run: uv build
      - name: Verify packaged review console
        run: uv run python scripts/verify-wheel-review-assets.py dist/*.whl
      - run: uv publish --trusted-publishing always
