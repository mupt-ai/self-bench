name: Full Deploy

on:
  workflow_call:
    inputs:
      target_environment:
        type: string
        required: true

permissions: {}

# Never cancel a running apply. Terraform additionally locks its own GCS state.
concurrency:
  group: terraform-${{ inputs.target_environment }}
  cancel-in-progress: false

jobs:
  validate:
    if: vars.GCP_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run validate

  deploy:
    needs: validate
    if: needs.validate.result == 'success' && vars.GCP_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Production approval belongs to prod; dev follows its own environment policy.
    environment: ${{ inputs.target_environment }}
    permissions:
      contents: read
      actions: read
      deployments: read
      id-token: write
    env:
      TF_ENVIRONMENT: ${{ inputs.target_environment }}
      GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_INPUTS_JSON: ${{ vars.TF_INPUTS_JSON }}
      SELFBENCH_PUBLIC_URL: ${{ vars.SELFBENCH_PUBLIC_URL }}
      SELFBENCH_RESULTS_SITE_URL: ${{ vars.SELFBENCH_RESULTS_SITE_URL }}
      SELFBENCH_ACTIVITY_CONCURRENCY: ${{ vars.SELFBENCH_ACTIVITY_CONCURRENCY }}
      RELEASE_PRERELEASE: ${{ toJSON(github.event.release.prerelease) }}
      RELEASE_DRAFT: ${{ toJSON(github.event.release.draft) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify Trusted Deploy Source and Runtime Settings
        run: bash infra/ci/verify-source.sh
      - name: Image Coordinates
        id: coordinates
        run: |
          set -euo pipefail
          jq -e --arg project "$GCP_PROJECT_ID" \
            'type == "object" and .project_id == $project' <<<"$TF_INPUTS_JSON" >/dev/null
          registry="$(jq -r '.region // "us-central1"' <<<"$TF_INPUTS_JSON")-docker.pkg.dev"
          echo "registry=$registry" >> "$GITHUB_OUTPUT"
          echo "image_prefix=$registry/$GCP_PROJECT_ID/selfbench/selfbench" >> "$GITHUB_OUTPUT"
      # The apply identity pushes the image, backs up the database and applies the plan.
      - name: Authenticate Apply Identity
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_APPLY_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_APPLY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Authenticate Docker to Artifact Registry
        run: gcloud auth configure-docker "$REGISTRY" --quiet
        env:
          REGISTRY: ${{ steps.coordinates.outputs.registry }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # GHA layer cache holds build layers only, never runtime credentials or private Terraform logs.
      - name: Build and Push Image
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.coordinates.outputs.image_prefix }}:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          build-args: SELFBENCH_BUILD_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=${{ inputs.target_environment }}
          cache-to: type=gha,scope=${{ inputs.target_environment }},mode=max
      - name: Authenticate Terraform Plan
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_PLAN_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_PLAN_SERVICE_ACCOUNT }}
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.14.2
          terraform_wrapper: false
      # The release is plain Terraform input: the pushed digest, pinned secret versions and
      # worker concurrency. Applying it rolls the API revision, then the worker pool.
      - name: Generate Terraform Plan
        id: plan
        env:
          IMAGE: ${{ steps.coordinates.outputs.image_prefix }}@${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          export TF_DATA_DIR="$RUNNER_TEMP/terraform-data"
          root="infra/terraform/environments/$TF_ENVIRONMENT"
          jq -n --argjson inputs "$TF_INPUTS_JSON" --arg image "$IMAGE" \
              --argjson secret_versions "$RUNTIME_SECRET_VERSIONS" \
              --argjson activity_concurrency "$SELFBENCH_ACTIVITY_CONCURRENCY" \
              '$inputs + {image: $image, secret_versions: $secret_versions, activity_concurrency: $activity_concurrency}' \
            > "$RUNNER_TEMP/terraform.tfvars.json"
          terraform -chdir="$root" init -input=false -lockfile=readonly -backend-config="bucket=$TF_STATE_BUCKET"
          terraform -chdir="$root" validate
          terraform -chdir="$root" plan -input=false -no-color -lock-timeout=5m \
            -var-file="$RUNNER_TEMP/terraform.tfvars.json" -out="$RUNNER_TEMP/terraform.tfplan"
          database=$(terraform -chdir="$root" output -json deployment 2>/dev/null | jq -r '.database.instance // "" | split(":")[-1]' || true)
          echo "database_instance=$database" >> "$GITHUB_OUTPUT"
      - name: Authenticate Terraform Apply
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_APPLY_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_APPLY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      # Synchronous provider backup before the new API revision migrates the schema.
      - name: Back Up Database
        if: steps.plan.outputs.database_instance != ''
        run: gcloud sql backups create --instance="$INSTANCE" --project="$GCP_PROJECT_ID" --quiet
        env:
          INSTANCE: ${{ steps.plan.outputs.database_instance }}
      - name: Apply Terraform Plan
        run: |
          export TF_DATA_DIR="$RUNNER_TEMP/terraform-data"
          terraform -chdir="infra/terraform/environments/$TF_ENVIRONMENT" apply \
            -input=false -no-color -lock-timeout=5m "$RUNNER_TEMP/terraform.tfplan"
      - name: Verify Public HTTPS
        run: |
          curl --fail --silent --show-error --max-time 30 --output /dev/null "$SELFBENCH_PUBLIC_URL/healthz"
          status=$(curl --silent --max-time 30 --output /dev/null --write-out '%{http_code}' "$SELFBENCH_PUBLIC_URL/api/session")
          test "$status" = 401 || { echo "Anonymous session was not rejected (HTTP $status)"; exit 1; }
          # The public results site: its own page and API, and none of the app's surface.
          curl --fail --silent --show-error --max-time 30 "$SELFBENCH_RESULTS_SITE_URL/" | grep -q 'name="selfbench-app-url"' \
            || { echo "The results site did not serve its own page"; exit 1; }
          curl --fail --silent --show-error --max-time 30 --output /dev/null "$SELFBENCH_RESULTS_SITE_URL/api/public/releases"
          status=$(curl --silent --max-time 30 --output /dev/null --write-out '%{http_code}' "$SELFBENCH_RESULTS_SITE_URL/api/session")
          test "$status" = 404 || { echo "The results site exposes the app's API (HTTP $status)"; exit 1; }
      - name: Record Deployment
        env:
          IMAGE: ${{ steps.coordinates.outputs.image_prefix }}@${{ steps.image.outputs.digest }}
        run: |
          {
            echo "## Deployed ${TF_ENVIRONMENT}"
            echo "Image: \`${IMAGE}\`"
            echo
            echo "API service and worker pool rolled out; HTTPS health, anonymous auth rejection and results site checks passed."
          } >> "$GITHUB_STEP_SUMMARY"
