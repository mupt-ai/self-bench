name: Full Deploy

on:
  workflow_call:
    inputs:
      target_environment:
        type: string
        required: true

permissions: {}

# Never cancel a running apply. Terraform additionally locks its own GCS state.
concurrency:
  group: terraform-${{ inputs.target_environment }}
  cancel-in-progress: false

jobs:
  validate:
    if: vars.GCP_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run validate

  # Dev builds and pushes its image alongside the checks rather than after them. Nothing is
  # deployed until the checks pass, and if this job fails the deploy job builds the image itself,
  # as it always does for prod (where a second job would need a second approval).
  image:
    if: vars.GCP_DEPLOY_ENABLED == 'true' && inputs.target_environment == 'dev'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    environment:
      name: ${{ inputs.target_environment }}
      # Building is not deploying: the environment's deployment history is the deploy job's.
      deployment: false
    permissions:
      contents: read
      id-token: write
    env:
      TF_ENVIRONMENT: ${{ inputs.target_environment }}
      GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      TF_INPUTS_JSON: ${{ vars.TF_INPUTS_JSON }}
      SELFBENCH_PUBLIC_URL: ${{ vars.SELFBENCH_PUBLIC_URL }}
      SELFBENCH_RESULTS_SITE_URL: ${{ vars.SELFBENCH_RESULTS_SITE_URL }}
      SELFBENCH_ACTIVITY_CONCURRENCY: ${{ vars.SELFBENCH_ACTIVITY_CONCURRENCY }}
    outputs:
      image: ${{ steps.build.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify Trusted Deploy Source and Runtime Settings
        run: bash infra/ci/verify-source.sh
      - name: Authenticate Apply Identity
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_APPLY_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_APPLY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Build and Push Image
        id: build
        uses: ./.github/actions/build-image
        with:
          environment: ${{ inputs.target_environment }}

  deploy:
    needs: [validate, image]
    # Runs once the checks pass, whether the image job built the image, failed, or was skipped.
    if: ${{ !cancelled() && needs.validate.result == 'success' && vars.GCP_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Production approval belongs to prod; dev follows its own environment policy.
    environment: ${{ inputs.target_environment }}
    permissions:
      contents: read
      actions: read
      deployments: read
      id-token: write
    env:
      TF_ENVIRONMENT: ${{ inputs.target_environment }}
      GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_INPUTS_JSON: ${{ vars.TF_INPUTS_JSON }}
      SELFBENCH_PUBLIC_URL: ${{ vars.SELFBENCH_PUBLIC_URL }}
      SELFBENCH_RESULTS_SITE_URL: ${{ vars.SELFBENCH_RESULTS_SITE_URL }}
      SELFBENCH_ACTIVITY_CONCURRENCY: ${{ vars.SELFBENCH_ACTIVITY_CONCURRENCY }}
      RELEASE_PRERELEASE: ${{ toJSON(github.event.release.prerelease) }}
      RELEASE_DRAFT: ${{ toJSON(github.event.release.draft) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify Trusted Deploy Source and Runtime Settings
        run: bash infra/ci/verify-source.sh
      # The apply identity pushes the image, backs up the database and applies the plan.
      - name: Authenticate Apply Identity
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_APPLY_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_APPLY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          # Terraform's Helm provider reaches the GKE worker cluster through it.
          install_components: gke-gcloud-auth-plugin
      # On dev, only when the image job did not push one. That job may have pushed and still
      # failed (say, saving the layer cache), so this build takes a tag of its own.
      - name: Build and Push Image
        id: build
        if: needs.image.outputs.image == ''
        uses: ./.github/actions/build-image
        with:
          environment: ${{ inputs.target_environment }}
          tag_suffix: ${{ inputs.target_environment == 'dev' && '-fallback' || '' }}
      - name: Image to Release
        id: release
        env:
          BUILT_EARLY: ${{ needs.image.outputs.image }}
          BUILT_HERE: ${{ steps.build.outputs.image }}
        run: |
          set -euo pipefail
          image=${BUILT_EARLY:-$BUILT_HERE}
          [[ "$image" =~ ^[a-z0-9-]+-docker\.pkg\.dev/$GCP_PROJECT_ID/selfbench/selfbench@sha256:[0-9a-f]{64}$ ]] \
            || { echo "No image to release from this project's registry: '$image'" >&2; exit 1; }
          echo "image=$image" >> "$GITHUB_OUTPUT"
      - name: Authenticate Terraform Plan
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_PLAN_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_PLAN_SERVICE_ACCOUNT }}
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.14.2
          terraform_wrapper: false
      # The release is plain Terraform input: the pushed digest, public origins, run identity and
      # worker concurrency. Applying it rolls the API revision, then the worker pool.
      - name: Generate Terraform Plan
        id: plan
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          RELEASE_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          export TF_DATA_DIR="$RUNNER_TEMP/terraform-data"
          root="infra/terraform/environments/$TF_ENVIRONMENT"
          # The results site's host, from the origin verify-source.sh checked (https://host[:port]),
          # puts that host behind Cloud CDN.
          results_site_domain="${SELFBENCH_RESULTS_SITE_URL#https://}"
          results_site_domain="$(tr '[:upper:]' '[:lower:]' <<<"${results_site_domain%%:*}")"
          jq -n --argjson inputs "$TF_INPUTS_JSON" --arg image "$IMAGE" \
              --arg release_id "$RELEASE_ID" \
              --arg public_url "$SELFBENCH_PUBLIC_URL" \
              --arg results_site_url "$SELFBENCH_RESULTS_SITE_URL" \
              --argjson activity_concurrency "$SELFBENCH_ACTIVITY_CONCURRENCY" \
              --arg results_site_domain "$results_site_domain" \
              '$inputs + {image: $image, release_id: $release_id, public_url: $public_url, results_site_url: $results_site_url, activity_concurrency: $activity_concurrency, results_site_domain: $results_site_domain}' \
            > "$RUNNER_TEMP/terraform.tfvars.json"
          terraform -chdir="$root" init -input=false -lockfile=readonly -backend-config="bucket=$TF_STATE_BUCKET"
          terraform -chdir="$root" validate
          terraform -chdir="$root" plan -input=false -no-color -lock-timeout=5m \
            -var-file="$RUNNER_TEMP/terraform.tfvars.json" -out="$RUNNER_TEMP/terraform.tfplan"
          database=$(terraform -chdir="$root" output -json deployment 2>/dev/null | jq -r '.database.instance // "" | split(":")[-1]' || true)
          echo "database_instance=$database" >> "$GITHUB_OUTPUT"
      - name: Authenticate Terraform Apply
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_APPLY_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_APPLY_SERVICE_ACCOUNT }}
      # gcloud and its GKE plugin are already installed, and the step above points them at the
      # apply identity (CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE), so neither is set up again.
      # Prod backs up before every release. Dev backs up only when the release brings migrations
      # its database has not run; Cloud SQL's daily backups and point-in-time recovery cover the
      # rest.
      - name: Check for New Migrations
        id: migrations
        if: steps.plan.outputs.database_instance != '' && inputs.target_environment == 'dev'
        run: bash infra/ci/new-migrations.sh
        env:
          GH_TOKEN: ${{ github.token }}
      # Synchronous provider backup before the new API revision migrates the schema.
      - name: Back Up Database
        if: steps.plan.outputs.database_instance != '' && steps.migrations.outputs.new != 'false'
        run: gcloud sql backups create --instance="$INSTANCE" --project="$GCP_PROJECT_ID" --quiet
        env:
          INSTANCE: ${{ steps.plan.outputs.database_instance }}
      - name: Apply Terraform Plan
        run: |
          export TF_DATA_DIR="$RUNNER_TEMP/terraform-data"
          terraform -chdir="infra/terraform/environments/$TF_ENVIRONMENT" apply \
            -input=false -no-color -lock-timeout=5m "$RUNNER_TEMP/terraform.tfplan"
      # A results site page names its build's scripts, so the CDN must not keep serving the
      # previous build's pages. Cloud CDN clears by path prefix and every page has its own path,
      # so the whole host is cleared; files that did not change refill once per edge.
      - name: Clear the Results Site CDN
        run: |
          set -euo pipefail
          export TF_DATA_DIR="$RUNNER_TEMP/terraform-data"
          cdn=$(terraform -chdir="infra/terraform/environments/$TF_ENVIRONMENT" output -json deployment \
            | jq -c '.api.results_site_cdn // empty')
          if [ -z "$cdn" ]; then
            echo "No results site CDN to clear"
            exit 0
          fi
          gcloud compute url-maps invalidate-cdn-cache "$(jq -r .url_map <<<"$cdn")" \
            --host="$(jq -r .host <<<"$cdn")" --path="/*" --global --project="$GCP_PROJECT_ID" --quiet
      - name: Verify Public HTTPS
        run: |
          curl --fail --silent --show-error --max-time 30 --output /dev/null "$SELFBENCH_PUBLIC_URL/healthz"
          status=$(curl --silent --max-time 30 --output /dev/null --write-out '%{http_code}' "$SELFBENCH_PUBLIC_URL/api/session")
          test "$status" = 401 || { echo "Anonymous session was not rejected (HTTP $status)"; exit 1; }
          # The public results site: its own page and API, and none of the app's surface.
          curl --fail --silent --show-error --max-time 30 "$SELFBENCH_RESULTS_SITE_URL/" | grep -q 'name="selfbench-app-url"' \
            || { echo "The results site did not serve its own page"; exit 1; }
          curl --fail --silent --show-error --max-time 30 --output /dev/null "$SELFBENCH_RESULTS_SITE_URL/api/public/releases"
          status=$(curl --silent --max-time 30 --output /dev/null --write-out '%{http_code}' "$SELFBENCH_RESULTS_SITE_URL/api/session")
          test "$status" = 404 || { echo "The results site exposes the app's API (HTTP $status)"; exit 1; }
      - name: Record Deployment
        env:
          IMAGE: ${{ steps.release.outputs.image }}
        run: |
          {
            echo "## Deployed ${TF_ENVIRONMENT}"
            echo "Image: \`${IMAGE}\`"
            echo
            echo "API service and worker pool rolled out; HTTPS health, anonymous auth rejection and results site checks passed."
          } >> "$GITHUB_STEP_SUMMARY"
