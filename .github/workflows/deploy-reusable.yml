name: Full Deploy

on:
  workflow_call:
    inputs:
      target_environment:
        type: string
        required: true

      infrastructure_only:
        type: boolean
        default: false

permissions: {}

# Never cancel a running apply. Terraform additionally locks its own GCS state.
concurrency:
  group: terraform-${{ inputs.target_environment }}
  cancel-in-progress: false

jobs:
  validate:
    if: vars.GCP_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run validate

  deploy:
    needs: validate
    if: needs.validate.result == 'success' && vars.GCP_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Production approval belongs to prod; dev follows its own environment policy.
    environment: ${{ inputs.target_environment }}
    permissions:
      contents: read
      actions: read
      deployments: read
      id-token: write
    env:
      TF_ENVIRONMENT: ${{ inputs.target_environment }}
      INFRASTRUCTURE_ONLY: ${{ inputs.infrastructure_only }}
      GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_INPUTS_JSON: ${{ vars.TF_INPUTS_JSON }}
      SELFBENCH_PUBLIC_URL: ${{ vars.SELFBENCH_PUBLIC_URL }}
      SELFBENCH_RESULTS_SITE_URL: ${{ vars.SELFBENCH_RESULTS_SITE_URL }}
      SELFBENCH_ACTIVITY_CONCURRENCY: ${{ vars.SELFBENCH_ACTIVITY_CONCURRENCY }}
      RELEASE_PRERELEASE: ${{ toJSON(github.event.release.prerelease) }}
      RELEASE_DRAFT: ${{ toJSON(github.event.release.draft) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify Trusted Deploy Source and Runtime Settings
        run: bash infra/ci/verify-source.sh
      - name: Authenticate Terraform Plan
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_PLAN_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_PLAN_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.14.2
          terraform_wrapper: false
      - name: Generate Terraform Plan
        id: plan
        run: |
          set -euo pipefail
          export TF_DATA_DIR="$RUNNER_TEMP/terraform-data"
          root="infra/terraform/environments/$TF_ENVIRONMENT"
          jq -e --arg project "$GCP_PROJECT_ID" \
            'type == "object" and .project_id == $project' <<<"$TF_INPUTS_JSON" >/dev/null
          printf '%s' "$TF_INPUTS_JSON" > "$RUNNER_TEMP/terraform.tfvars.json"
          terraform -chdir="$root" init -input=false -lockfile=readonly -backend-config="bucket=$TF_STATE_BUCKET"
          terraform -chdir="$root" validate
          set +e
          terraform -chdir="$root" plan -input=false -no-color -lock-timeout=5m -detailed-exitcode \
            -var-file="$RUNNER_TEMP/terraform.tfvars.json" -out="$RUNNER_TEMP/terraform.tfplan"
          status=$?
          set -e
          case "$status" in
            0) echo 'has_changes=false' >> "$GITHUB_OUTPUT" ;;
            2) echo 'has_changes=true' >> "$GITHUB_OUTPUT" ;;
            *) exit "$status" ;;
          esac
      - name: Authenticate Terraform Apply
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_APPLY_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_APPLY_SERVICE_ACCOUNT }}
      # Reconfigure gcloud as well as ADC so OS Login uses the apply account.
      - name: Configure gcloud for Apply
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Apply Terraform Plan
        if: steps.plan.outputs.has_changes == 'true'
        run: |
          set -euo pipefail
          export TF_DATA_DIR="$RUNNER_TEMP/terraform-data"
          terraform -chdir="infra/terraform/environments/$TF_ENVIRONMENT" apply \
            -input=false -no-color -lock-timeout=5m "$RUNNER_TEMP/terraform.tfplan"
      - name: Infrastructure Bootstrap Complete
        if: inputs.infrastructure_only
        run: echo 'Infrastructure-only run complete. Configure DB login, secrets, Temporal, OAuth, DNS and TLS before a full deployment.' >> "$GITHUB_STEP_SUMMARY"
      - name: Read Release Coordinates
        if: ${{ !inputs.infrastructure_only }}
        id: coordinates
        run: |
          set -euo pipefail
          export TF_DATA_DIR="$RUNNER_TEMP/terraform-data"
          root="infra/terraform/environments/$TF_ENVIRONMENT"
          terraform -chdir="$root" init -input=false -lockfile=readonly -backend-config="bucket=$TF_STATE_BUCKET" >/dev/null
          deployment=$(terraform -chdir="$root" output -json deployment)
          jq -e --arg project "$GCP_PROJECT_ID" --arg environment "$TF_ENVIRONMENT" \
              '.project_id == $project and .environment == $environment' <<<"$deployment" >/dev/null \
            || { echo 'Terraform outputs belong to a different environment.' >&2; exit 1; }
          jq -e '.database != null' <<<"$deployment" >/dev/null \
            || { echo 'External databases require a reviewed backup adapter.' >&2; exit 1; }
          jq -r '
            "image_prefix=\(.image_prefix)",
            "registry=\(.image_prefix | split("/")[0])",
            "zone=\(.zone)",
            "instance=\(.instance)",
            "database_instance=\(.database.instance | split(":")[-1])",
            "api_service=\(.api.service)",
            "api_region=\(.api.region)"
          ' <<<"$deployment" >> "$GITHUB_OUTPUT"
      - name: Authenticate Docker to Artifact Registry
        if: ${{ !inputs.infrastructure_only }}
        run: gcloud auth configure-docker "$REGISTRY" --quiet
        env:
          REGISTRY: ${{ steps.coordinates.outputs.registry }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: ${{ !inputs.infrastructure_only }}
      # GHA layer cache holds build layers only, never runtime credentials or private Terraform logs.
      - name: Build and Push Image
        if: ${{ !inputs.infrastructure_only }}
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.coordinates.outputs.image_prefix }}:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          build-args: SELFBENCH_BUILD_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=${{ inputs.target_environment }}
          cache-to: type=gha,scope=${{ inputs.target_environment }},mode=max
      # Synchronous provider backup before any schema changes. Failure blocks the rollout.
      - name: Back Up Database
        if: ${{ !inputs.infrastructure_only }}
        run: gcloud sql backups create --instance="$INSTANCE" --project="$GCP_PROJECT_ID" --quiet
        env:
          INSTANCE: ${{ steps.coordinates.outputs.database_instance }}
      - name: Migrate and Roll Out the Worker on the VM
        if: ${{ !inputs.infrastructure_only }}
        env:
          SELFBENCH_IMAGE: ${{ steps.coordinates.outputs.image_prefix }}@${{ steps.image.outputs.digest }}
          IMAGE_PREFIX: ${{ steps.coordinates.outputs.image_prefix }}
          REGISTRY: ${{ steps.coordinates.outputs.registry }}
          ZONE: ${{ steps.coordinates.outputs.zone }}
          INSTANCE: ${{ steps.coordinates.outputs.instance }}
        run: |
          set -euo pipefail
          digest="${SELFBENCH_IMAGE#"$IMAGE_PREFIX"@}"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo 'Registry digest not confirmed.' >&2; exit 1; }
          release_id="$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          staging=$(mktemp -d)
          cp infra/runtime/deploy-host.sh infra/runtime/deploy-check.mjs infra/runtime/compose.yaml "$staging/"
          jq -Sc -n --arg project "$GCP_PROJECT_ID" --arg environment "$TF_ENVIRONMENT" --arg sha "$GITHUB_SHA" \
              --arg release_id "$release_id" --arg image "$SELFBENCH_IMAGE" --arg registry "$REGISTRY" \
              --argjson secret_versions "$RUNTIME_SECRET_VERSIONS" \
              --arg activity_concurrency "$SELFBENCH_ACTIVITY_CONCURRENCY" \
              '$ARGS.named' > "$staging/request.json"
          # One SSH session: a second OS Login cert after scp can fail with publickey on first-time profiles.
          remote="set -euo pipefail; mkdir -p /tmp/selfbench-release-$release_id; tar -C /tmp/selfbench-release-$release_id -xzf -;"
          remote+=" sudo install -d -m 0700 /var/lib/selfbench-deploy;"
          remote+=" sudo cp -r /tmp/selfbench-release-$release_id /var/lib/selfbench-deploy/$release_id;"
          remote+=" sudo chown -R root:root /var/lib/selfbench-deploy/$release_id;"
          remote+=" sudo chmod -R go-rwx /var/lib/selfbench-deploy/$release_id;"
          remote+=" sudo bash -c 'cd /var/lib/selfbench-deploy/$release_id && bash deploy-host.sh request.json > deploy.log 2>&1'"
          tar -C "$staging" -czf - . | gcloud compute ssh "$INSTANCE" --project="$GCP_PROJECT_ID" --zone="$ZONE" \
            --tunnel-through-iap --quiet --command="$remote" -- -T
      # Migrations already ran on the VM. A revision that fails to start never takes traffic.
      - name: Roll Out the API on Cloud Run
        if: ${{ !inputs.infrastructure_only }}
        env:
          SELFBENCH_IMAGE: ${{ steps.coordinates.outputs.image_prefix }}@${{ steps.image.outputs.digest }}
          SERVICE: ${{ steps.coordinates.outputs.api_service }}
          REGION: ${{ steps.coordinates.outputs.api_region }}
        run: |
          set -euo pipefail
          shared=$(jq -er '.shared' <<<"$RUNTIME_SECRET_VERSIONS")
          api=$(jq -er '.api' <<<"$RUNTIME_SECRET_VERSIONS")
          # ^;^ makes ";" the list separator, since SELFBENCH_ENV_FILES itself holds a comma.
          gcloud run deploy "$SERVICE" --project="$GCP_PROJECT_ID" --region="$REGION" --quiet \
            --image="$SELFBENCH_IMAGE" --command=node --args=dist/api/cloud-run.js \
            --set-secrets="/secrets/shared/env=selfbench-shared-env:$shared,/secrets/api/env=selfbench-api-env:$api" \
            --set-env-vars="^;^SELFBENCH_ENV_FILES=/secrets/shared/env,/secrets/api/env;SELFBENCH_FORWARDED_HOPS=2"
      - name: Verify Public HTTPS
        if: ${{ !inputs.infrastructure_only }}
        run: |
          curl --fail --silent --show-error --max-time 30 --output /dev/null "$SELFBENCH_PUBLIC_URL/healthz"
          status=$(curl --silent --max-time 30 --output /dev/null --write-out '%{http_code}' "$SELFBENCH_PUBLIC_URL/api/session")
          test "$status" = 401 || { echo "Anonymous session was not rejected (HTTP $status)"; exit 1; }
          # The public results site: its own page and API, and none of the app's surface.
          curl --fail --silent --show-error --max-time 30 "$SELFBENCH_RESULTS_SITE_URL/" | grep -q 'name="selfbench-app-url"' \
            || { echo "The results site did not serve its own page"; exit 1; }
          curl --fail --silent --show-error --max-time 30 --output /dev/null "$SELFBENCH_RESULTS_SITE_URL/api/public/releases"
          status=$(curl --silent --max-time 30 --output /dev/null --write-out '%{http_code}' "$SELFBENCH_RESULTS_SITE_URL/api/session")
          test "$status" = 404 || { echo "The results site exposes the app's API (HTTP $status)"; exit 1; }
      - name: Record Deployment
        if: ${{ !inputs.infrastructure_only }}
        env:
          IMAGE: ${{ steps.coordinates.outputs.image_prefix }}@${{ steps.image.outputs.digest }}
          API_SERVICE: ${{ steps.coordinates.outputs.api_service }}
        run: |
          {
            echo "## Deployed ${TF_ENVIRONMENT}"
            echo "Image: \`${IMAGE}\`"
            echo
            echo "API on Cloud Run service \`${API_SERVICE}\`; HTTPS health, anonymous auth rejection, results site and VM worker checks passed."
          } >> "$GITHUB_STEP_SUMMARY"
